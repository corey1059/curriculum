        q: "17. According to General Specifications (Section 5 - Project Sign Boards), prior to the release of holdback following construction, what must the Contractor do with the two 1.22 m x 2.44 m project sign boards?",
        options: [
          "Dispose of them at the City landfill",
          "Leave them erected on site for the 2-year maintenance period",
          "Remove and return them to the City of London Sign Shop (Adelaide North Yard - 1159 Adelaide St. N)",
          "Deliver them to the Consulting Engineer's office"
        ],
        answer: 2,
        explanation: "General Specifications Section 5 requires the Contractor to remove the project signs following construction (prior to release of holdback) and return them to the City of London sign shop at 1159 Adelaide St. N."
      },
      {
        q: "18. According to the General Specifications, if a watermain or sewer excavation will come within 1 m (top of slope) of a London Hydro pole, the Contractor must request hydro pole support assistance at least how many working days in advance?",
        options: ["1 working day", "2 working days", "3 working days", "10 working days"],
        answer: 2,
        explanation: "The General Specifications require calling London Hydro for pole support assistance at least 3 working days before excavating within 1 m (top of slope) of all hydro poles."
      },
      {
        q: "19. In the City of London Supplemental Standards for Sewer and Water, what corrosion protection is required on buried metallic fittings, mechanical joints, and restraining glands on watermains?",
        options: [
          "Lead-based red oxide primer",
          "Denso petrolatum paste, primer, and tape wrap system (or approved corrosion protection) plus sacrificial anodes",
          "No protection is required if backfilled with sand",
          "Galvanized zinc spray paint only"
        ],
        answer: 1,
        explanation: "All buried metallic watermain fittings, bolts, and mechanical joints must be protected against corrosion using a petrolatum paste/tape wrap system (Denso or approved equal) and sacrificial zinc/magnesium anodes as specified."
      },
      {
        q: "20. Under the Standard Contract Documents (Section 441 Measurement for Payment), how are Fire Hydrant Sets measured for payment, and what is included in the item?",
        options: [
          "By the vertical metre of barrel; excludes the isolation valve",
          "By the unit (each); includes placing the hydrant, hydrant isolation gate valve, valve box, tee, lead pipe, and thrust restraint/blocking",
          "Lump sum for the entire contract",
          "By weight in tonnes of cast iron installed"
        ],
        answer: 1,
        explanation: "Hydrant sets are measured by the unit (each) and include the supply and installation of the hydrant, hydrant lead/lateral pipe, hydrant isolation gate valve and box, anchoring/restraint, and boot block."
      }
    ]
  }
};

let currentTest = 'test1';
const state = {
  test1: { answered: 0, score: 0, responses: {} },
  test2: { answered: 0, score: 0, responses: {} }
};

function renderTest() {
  const container = document.getElementById('test-content');
  const data = testData[currentTest];
  const st = state[currentTest];

  let html = `
    <div class="test-header-card">
      <h2>${data.title}</h2>
      <p>${data.subtitle}</p>
    </div>
  `;

  data.questions.forEach((item, qIdx) => {
    const userResp = st.responses[qIdx];
    const isAnswered = userResp !== undefined;
    const isCorrect = isAnswered && userResp === item.answer;

    html += `
      <div class="q-card" id="qcard-${qIdx}">
        <div class="q-title">${item.q}</div>
        <div class="options">
    `;

    item.options.forEach((opt, oIdx) => {
      let btnClass = 'opt-btn';
      if (isAnswered) {
        if (oIdx === item.answer) btnClass += ' correct';
        else if (oIdx === userResp) btnClass += ' incorrect';
      }
      const disabledAttr = isAnswered ? 'disabled' : '';
      const letter = String.fromCharCode(65 + oIdx);
      html += `
        <button class="${btnClass}" ${disabledAttr} onclick="selectOption(${qIdx}, ${oIdx})">
          <strong>${letter}.</strong> ${opt}
        </button>
      `;
    });

    html += `
        </div>
        <div class="feedback ${isAnswered ? 'show ' + (isCorrect ? 'ok' : 'err') : ''}" id="fb-${qIdx}">
          ${isAnswered ? `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${item.explanation}` : ''}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  updateScoreboard();
}

function selectOption(qIdx, oIdx) {
  const st = state[currentTest];
  if (st.responses[qIdx] !== undefined) return;

  st.responses[qIdx] = oIdx;
  st.answered++;
  if (oIdx === testData[currentTest].questions[qIdx].answer) {
    st.score++;
  }
  renderTest();
}

function updateScoreboard() {
  const st = state[currentTest];
  const total = testData[currentTest].questions.length;
  const pct = st.answered > 0 ? Math.round((st.score / st.answered) * 100) : 0;

  document.getElementById('progress-text').textContent = `Answered: ${st.answered} / ${total}`;
  document.getElementById('score-text').textContent = `Score: ${st.score} / ${st.answered} (${pct}%)`;
}

function switchTest(testKey) {
  currentTest = testKey;
  document.getElementById('tab-test1').classList.toggle('active', testKey === 'test1');
  document.getElementById('tab-test2').classList.toggle('active', testKey === 'test2');
  renderTest();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetCurrentTest() {
  state[currentTest] = { answered: 0, score: 0, responses: {} };
  renderTest();
}

renderTest();
</script>

</body>
</html>
